services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: movie-backend
    ports:
      - "${BACKEND_PORT}:5000"
    depends_on: 
      - postgres
    env_file:
      - ./backend/.env
    environment: 
      DB_HOST: postgres
    networks:
      - movie-network
    
  frontend:
    build: 
      context: ./frontend
    container_name: movie-frontend
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    environment:
      - REACT_APP_API_URL=http://localhost:5000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - movie-network


  postgres:
    image: postgres:17
    container_name: movie-postgres
    restart: always
    environment: 
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/database_movies.sql:/docker-entrypoint-initdb.d/database_movies.sql
    networks:
      - movie-network

volumes:
  postgres-data:

networks:
  movie-network: